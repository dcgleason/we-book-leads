<style>
:root{
  color-scheme: light;
  --primary:#0e7c74; --primary-dark:#095e57; --primary-soft:#ddeeea; --tint:#eef3f1;
  --ink:#12212e; --ink-2:#354a5a; --muted:#5f7482; --line:#d5e0dc;
  --accent:#c96f2e; --accent-soft:#fbeedd;
  --navy:#0f2a3f; --navy-deep:#0a1e2e; --navy-mid:#16344e;
  --green:#177a52; --green-soft:#dff2e7;
  --red:#c0392b;
  --card:#ffffff; --radius:10px;
  --shadow:0 16px 44px rgba(15,42,63,.13);
  --shadow-sm:0 6px 22px rgba(15,42,63,.09);
  /* legacy aliases so inline/component refs keep working with the new palette */
  --purple:var(--primary); --purple-dark:var(--primary-dark); --purple-soft:var(--primary-soft); --purple-tint:var(--tint);
  --yellow:#ffffff; --yellow-dark:var(--accent);
  --hero-1:var(--navy-deep); --hero-2:var(--navy-mid);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--tint);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button,[role="button"],select,summary,input:not([type="checkbox"]){min-height:2.25rem}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-weight:600}
h1,h2,h3{margin:0;line-height:1.12;letter-spacing:-.01em}
h3{font-family:"Public Sans",system-ui,sans-serif;font-weight:800}
p{margin:0}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--primary);display:flex;align-items:center;gap:.6rem}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--accent);flex:0 0 auto}
.sec-head.center .eyebrow,.hero-copy .eyebrow{justify-content:flex-start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;cursor:pointer;font:inherit;font-weight:800;border-radius:8px;padding:.85rem 1.4rem;text-decoration:none;transition:background .15s ease,border-color .15s ease;font-size:.97rem;min-height:3rem}
.btn-yellow{background:var(--primary);color:#fff;box-shadow:none}
.btn-yellow:hover{background:var(--primary-dark)}
.btn-purple{background:var(--navy);color:#fff;box-shadow:none}
.btn-purple:hover{background:var(--navy-mid)}
.btn-ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--primary)}
.checks{list-style:none;margin:1.4rem 0;padding:0;display:grid;gap:.85rem}
.checks li{display:flex;gap:.7rem;align-items:flex-start;font-weight:600;color:var(--ink-2);font-size:1.02rem}
.checks .ck{flex:0 0 auto;width:24px;height:24px;border-radius:6px;background:var(--primary-soft);color:var(--primary-dark);display:grid;place-items:center;margin-top:.05rem}
.checks .ck svg{width:13px;height:13px}
.trustline{display:flex;flex-wrap:wrap;gap:1.1rem;margin-top:1.1rem;color:var(--muted);font-size:.9rem;font-weight:600}
.trustline span{display:inline-flex;gap:.4rem;align-items:center}
.trustline svg{width:15px;height:15px;color:var(--green)}


/* ── top bar: slim navy strip, left/right split ── */
.topbar{background:var(--navy-deep);color:#dbe7e2;text-align:left;font-weight:600;font-size:.88rem;padding:.55rem 0}
.topbar .wrap{
